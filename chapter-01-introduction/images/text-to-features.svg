<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="tt dd">
<title id="tt">How can a model work with text?</title>
<desc id="dd">Three email phrases are transformed into simple numeric features indicating whether prize and meeting occur.</desc>
<rect width="960" height="390" rx="22" fill="#0B1220"/>
<text x="42" y="47" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="bold" text-anchor="start">How can a model work with text?</text>
<rect x="40" y="100" width="278" height="185" rx="14" fill="#142238" stroke="#38BDF8" stroke-width="1"/>
<text x="58" y="136" fill="#38BDF8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Email text</text>
<text x="58" y="172" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">&quot;Free prize available&quot;</text>
<text x="58" y="197" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">&quot;Meeting at 2 pm&quot;</text>
<line x1="330" y1="193" x2="411" y2="193" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
<polygon points="411.0,193.0 403.3,197.7 403.3,188.3" fill="#38BDF8"/>
<rect x="423" y="100" width="488" height="185" rx="14" fill="#142238" stroke="#2DD4BF" stroke-width="1"/>
<text x="441" y="136" fill="#2DD4BF" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Simple numeric representation</text>
<text x="441" y="172" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Feature 1: contains &quot;prize&quot;?  1 or 0</text>
<text x="441" y="197" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Feature 2: contains &quot;meeting&quot;?  1 or 0</text>
<rect x="71" y="308" width="210" height="35" rx="10" fill="#142238" stroke="#38BDF8" stroke-width="1"/>
<text x="176.0" y="331" fill="#38BDF8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Words</text>
<line x1="301" y1="326" x2="389" y2="326" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
<polygon points="389.0,326.0 381.3,330.7 381.3,321.3" fill="#2DD4BF"/>
<rect x="411" y="308" width="408" height="35" rx="10" fill="#142238" stroke="#2DD4BF" stroke-width="1"/>
<text x="615.0" y="331" fill="#2DD4BF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Numbers a model can process</text>
<text x="42" y="366" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">A feature is a useful property of an input. Real text models use richer representations.</text>
</svg>