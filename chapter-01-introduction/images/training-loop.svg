<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Training loop from data through model, loss and optimizer</title><desc id="d">Data are passed to a model to create predictions, predictions are compared with targets through a loss function, an optimizer adjusts model parameters, and the cycle repeats.</desc><rect width="960" height="420" rx="24" fill="#101828"/>
<text x="44" y="52" font-family="Arial" font-size="29" font-weight="700" fill="#F9FAFB">The training loop</text>
<rect x="36" y="126" width="184" height="106" rx="14" fill="#334155" stroke="#94A3B8"/><text x="128" y="168" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#F1F5F9">Data</text><text x="128" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#CBD5E1">emails + labels</text>
<rect x="272" y="126" width="184" height="106" rx="14" fill="#155E75"/><text x="364" y="169" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">Model</text><text x="364" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#CFFAFE">makes prediction</text>
<rect x="508" y="126" width="184" height="106" rx="14" fill="#7C3AED"/><text x="600" y="169" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">Loss</text><text x="600" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#F3E8FF">measures error</text>
<rect x="744" y="126" width="184" height="106" rx="14" fill="#166534"/><text x="836" y="169" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">Optimizer</text><text x="836" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#DCFCE7">updates parameters</text>
<g stroke="#93C5FD" stroke-width="4" fill="none"><path d="M222 179 H262 M458 179 H498 M694 179 H734"/></g><g fill="#93C5FD"><path d="M254 171 L265 179 L254 187Z M490 171 L501 179 L490 187Z M726 171 L737 179 L726 187Z"/></g>
<path d="M836 235 V305 H364 V239" fill="none" stroke="#86EFAC" stroke-width="4" stroke-dasharray="12 8"/><path d="M356 251 L364 238 L372 251" stroke="#86EFAC" fill="none" stroke-width="4"/>
<text x="600" y="335" text-anchor="middle" font-family="Arial" font-size="19" fill="#BBF7D0">Repeat with updated parameters</text>
<text x="480" y="389" text-anchor="middle" font-family="Arial" font-size="17" fill="#CBD5E1">The aim: better predictions on new examples, not just the training data.</text>
</svg>
