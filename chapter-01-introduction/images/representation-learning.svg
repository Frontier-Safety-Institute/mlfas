<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="tt dd">
<title id="tt">Deep learning: representations emerge through layers</title>
<desc id="dd">An input image progresses through simple visual patterns to combined patterns and a cat classifier; illustrative.</desc>
<rect width="960" height="390" rx="22" fill="#0B1220"/>
<text x="42" y="47" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="bold" text-anchor="start">Deep learning: representations emerge through layers</text>
<rect x="39" y="104" width="196" height="184" rx="14" fill="#142238" stroke="#38BDF8" stroke-width="1"/>
<text x="57" y="140" fill="#38BDF8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Input</text>
<text x="57" y="176" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Image pixels</text>
<line x1="245" y1="194" x2="277" y2="194" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
<polygon points="277.0,194.0 269.3,198.7 269.3,189.3" fill="#38BDF8"/>
<rect x="287" y="104" width="204" height="184" rx="14" fill="#142238" stroke="#C4B5FD" stroke-width="1"/>
<text x="305" y="140" fill="#C4B5FD" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Early layers</text>
<text x="305" y="176" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Lines and edges</text>
<line x1="501" y1="194" x2="536" y2="194" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
<polygon points="536.0,194.0 528.3,198.7 528.3,189.3" fill="#38BDF8"/>
<rect x="546" y="104" width="190" height="184" rx="14" fill="#142238" stroke="#2DD4BF" stroke-width="1"/>
<text x="564" y="140" fill="#2DD4BF" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Later layers</text>
<text x="564" y="176" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Combined patterns</text>
<line x1="745" y1="194" x2="777" y2="194" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
<polygon points="777.0,194.0 769.3,198.7 769.3,189.3" fill="#38BDF8"/>
<rect x="787" y="104" width="133" height="184" rx="14" fill="#142238" stroke="#FBBF24" stroke-width="1"/>
<text x="805" y="140" fill="#FBBF24" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Output</text>
<text x="805" y="176" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Cat / dog</text>
<text x="42" y="366" fill="#C0CEDF" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">This is a teaching intuition, not a claim that every network follows these exact steps.</text>
</svg>