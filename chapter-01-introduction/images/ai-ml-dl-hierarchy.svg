<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Relationship between AI, machine learning, deep learning, and many modern language models</title>
  <desc id="desc">A nested hierarchy: machine learning is within artificial intelligence, deep learning is within machine learning, and many modern language models use deep learning.</desc>
  <rect x="1" y="1" width="958" height="258" rx="12" fill="#242424" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27">
    <text x="36" y="57" font-weight="600">Artificial Intelligence (AI)</text>
    <path d="M92 73v16h22" fill="none" stroke="#bfc3c7" stroke-width="3"/>
    <text x="126" y="113" font-weight="600">Machine Learning (ML)</text>
    <path d="M200 129v16h22" fill="none" stroke="#bfc3c7" stroke-width="3"/>
    <text x="234" y="169" font-weight="600">Deep Learning (DL)</text>
    <path d="M306 185v16h22" fill="none" stroke="#bfc3c7" stroke-width="3"/>
    <text x="340" y="225" font-weight="600">Many modern language models</text>
  </g>
</svg>
